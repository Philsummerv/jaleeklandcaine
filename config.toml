# --- Claude -------------------------------------------------------------
# Each line notes the previous default ("was ...") so you can go back to it.
# The status line every 10 s shows spend, calls/min and tokens per call per component.

tactician_model = "claude-haiku-5-5"     # fast "hands". was "claude-haiku-4-5" (10x the price per token)
tactician_effort = "low"                 # low | medium | high. Set to "" for claude-haiku-4-5 (no effort support)
tactician_thinking = "disabled"          # "disabled" keeps replies fast; "adaptive" lets it think (slower, raise max_tokens)
tactician_max_tokens = 600               # was 1200; a plan is ~150-250 tokens

strategist_model = "claude-opus-5-5"     # slow "mind", picks objectives. "claude-sonnet-5-5" is about half the price
strategist_effort = "low"                # low | medium | high. was "medium"
strategist_max_tokens = 4000             # was 8000; a ceiling only, a cut-off reply is retried
strategist_interval_seconds = 120        # fallback timer. was 30. It's also called when an objective
                                         # completes, gets stuck, or the flee reflex fires.

# Tactician pacing: it calls Claude again when less than `lookahead` seconds of
# plan are left, but never more often than min_interval and at least every max_interval.
tactician_min_interval = 0.8
tactician_lookahead_seconds = 1.5
tactician_max_interval = 4.0

# "adaptive": ask for longer plans and call less often when calm (no alerts, reflexes or
# stuck reports in the last few seconds); back to short, fast plans when anything happens.
# "fixed": the old behaviour (2-5 s plans, max_interval always).
tactician_pacing = "adaptive"
tactician_calm_plan_seconds = [4, 8]
tactician_urgent_plan_seconds = [2, 4]
tactician_calm_max_interval = 10.0

# Skip a call when the screen hasn't changed since the last one (e.g. standing still, mining).
# Danger alerts and new objectives always get a call. Set false to disable.
tactician_skip_static_frames = true
tactician_static_threshold = 3.0         # mean pixel change (0-255) on a 32x18 thumbnail that counts as "changed"
tactician_static_interval = 3.0          # with an unchanged screen, call at most this often even if the plan ran out

# Reflex safety. The lava detector keys on colour, and bright orange rock (badlands)
# can read as lava; backing away repeatedly has walked the bot into holes.
flee_confirm_frames = 3       # health must read low this many frames running before fleeing
damage_confirm_frames = 3     # and a drop must hold this many frames before it counts as a hit
damage_threshold = 0.04       # how much of the bar must go before it counts as a hit at all
save_damage_frame = true      # save damage_trigger.png the first time, with the pixel counts logged
lava_max_backoffs = 3         # after this many lava triggers in the window, stop backing off
lava_window_seconds = 20      # and hand the decision to the tactician instead
save_lava_frame = true        # save lava_trigger.png the first time it fires, for tuning

# Stuck detection: walking with the view not changing means a wall or a pit. Local and free -
# it reuses the frame comparison the tactician pacing already does.
stuck_detect = true
stuck_seconds = 1.5           # how long to walk with a static view before saying so
stuck_change_threshold = 1.5  # mean pixel change (0-255) on a 32x18 thumbnail that counts as moving
stuck_cooldown_seconds = 6

# The bot stops itself once this much has been spent in one session.
max_dollars_per_session = 5.00

# --- Game / screen ---------------------------------------------------------
window_title = "Minecraft"
screenshot_width = 768        # screenshots are shrunk to this width before sending. was 1024.
                              # Image tokens ~ width x height / 750: 768x432 = ~440 tokens, 1024x576 = ~790.
jpeg_quality = 70             # doesn't affect token cost (that depends on pixel size), only upload size

# Mouse pixels per degree of camera turn. Run `python -m bot test-input` and adjust
# until the 360 turn ends where it started. Depends on your in-game sensitivity.
mouse_pixels_per_degree = 6.0

# How different (0-255) the crosshair area must become to count as "block broke".
mine_break_threshold = 28

# The bot re-reads this file while running: edit it by hand, or with `python -m bot manifesto`,
# and it recompiles its rules and milestones and picks a fresh objective. A change costs one
# compile call (about a cent); identical text is free, served from rules_cache.
manifesto_file = "manifesto.txt"
# Practical technique - climbing, mining, fighting, menus - handed to Claude as written.
# Re-read just as often, and free to change: there is nothing to compile.
techniques_file = "techniques.txt"
manifesto_reload_seconds = 2

log_file = "bot.log"
rules_cache = ".manifesto_rules.json"

# --- HUD reading (fractions of the window: x0, y0, x1, y1) ------------------
# Run `python -m bot calibrate` with full health/hunger and check calibration.png.
[hud]
# Tightened to hug the bars: they are drawn straight over the world, so every extra
# pixel of box is terrain that can match the colour masks (badlands red sand especially).
health_region = [0.355, 0.872, 0.497, 0.912]   # was [0.30, 0.83, 0.50, 0.935]
hunger_region = [0.503, 0.872, 0.645, 0.912]   # was [0.50, 0.83, 0.70, 0.935]
max_confirm_frames = 3        # a higher "full bar" reading must hold this many frames to count
smooth_frames = 5             # readings are the median of this many frames (reflexes run at 10 Hz),
                              # so a menu or screen transition can't read as a dying player
max_fall_per_frame = 0.05     # hunger drains over minutes, so a faster fall than this means
                              # something is covering the bar (Bedrock's hint popups sit on it).
                              # That frame is discarded, health included.
lava_region   = [0.30, 0.35, 0.70, 0.85]
lava_fraction = 0.12          # share of lava-colored pixels ahead that triggers the reflex
